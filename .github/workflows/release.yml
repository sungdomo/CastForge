name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Run release test suite
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build release artifacts
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/castforge dist/
          for lib in libcastforge.so libcastforge.dylib libcastforge.a; do
            if [ -f "target/${{ matrix.target }}/release/$lib" ]; then
              cp "target/${{ matrix.target }}/release/$lib" dist/
            fi
          done
          cp include/castforge.h dist/
          cp bindings/python/castforge.py dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          ARCHIVE="castforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist .
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/castforge.exe dist/
          foreach ($lib in @("castforge.dll", "castforge.dll.lib", "castforge.lib")) {
            $path = "target/${{ matrix.target }}/release/$lib"
            if (Test-Path $path) { Copy-Item $path dist/ }
          }
          Copy-Item include/castforge.h dist/
          Copy-Item bindings/python/castforge.py dist/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/
          $archive = "castforge-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            castforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            castforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
            castforge-${{ github.ref_name }}-${{ matrix.target }}.zip
            castforge-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release artifacts
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/castforge dist/
          cp include/castforge.h dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf castforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/castforge.exe dist/
          Copy-Item include/castforge.h dist/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path dist/* `
            -DestinationPath castforge-${{ github.ref_name }}-${{ matrix.target }}.zip
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            castforge-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            castforge-${{ github.ref_name }}-${{ matrix.target }}.zip

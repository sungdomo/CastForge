name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  check:
    name: Format, Clippy, Docs, 100-Col & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check 100-column line length limit
        run: |
          git ls-files | xargs awk 'length($0) > 100 {
            print FILENAME ":" FNR ":" length($0) ":" $0; exit 1
          }'
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Rustdoc
        run: cargo doc --no-deps
      - name: Run test suite
        run: cargo test

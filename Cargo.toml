[package]
name = "castforge"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sungdomo/CastForge"
description = "Pure-Rust AI Model IR Transformation, Optimization, Visualization, and Code Generation Suite"

[lib]
name = "castforge"
path = "src/lib.rs"

[[bin]]
name = "castforge"
path = "src/main.rs"

[dependencies]
slotmap = { version = "1.0", features = ["serde"] }
indexmap = { version = "2.7", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[package]
name = "castforge"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sungdomo/CastForge"
readme = "README.md"
description = """
Zero-C++ MLIR & StableHLO compiler in pure Rust: 115+ graph optimization, fusion, \
quantization, and weight-surgery passes with standalone CPU/GPU codegen."""
keywords = ["mlir", "stablehlo", "compiler", "machine-learning", "codegen"]
categories = ["compilers", "science", "command-line-utilities"]

[lib]
name = "castforge"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "castforge"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "compiler_bench"
harness = false

[features]
default = ["cli", "serving"]
cli = ["dep:clap"]
serving = []

[dependencies]
slotmap = { version = "1.0", features = ["serde"] }
indexmap = { version = "2.7", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
